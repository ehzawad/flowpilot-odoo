[project]
name = "flowpilot-odoo"
version = "0.1.0"
description = "Production-oriented agentic operations copilot for Odoo order-to-cash and inventory exceptions"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = { text = "Apache-2.0" }
authors = [{ name = "ehza" }]
dependencies = [
  "alembic>=1.18.4,<2",
  "fastapi==0.139.2",
  "httpx==0.28.1",
  "mcp>=1.28.1,<2",
  "openai==2.50.0",
  "openai-agents[sqlalchemy]==0.19.0",
  "orjson>=3.11,<4",
  "pgvector>=0.4,<1",
  "prometheus-client>=0.23,<1",
  "psycopg[binary,pool]>=3.3,<4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "PyJWT[crypto]>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "SQLAlchemy>=2.0.50,<2.1",
  "structlog>=25.4,<26",
  "tenacity>=9.1,<10",
  "uvicorn[standard]>=0.48,<1",
]

[project.optional-dependencies]
aws = ["boto3>=1.40,<2"]

[dependency-groups]
dev = [
  "aiosqlite>=0.21,<1",
  "coverage[toml]>=7.10,<8",
  "locust>=2.41,<3",
  "mypy>=1.18,<2",
  "pytest>=9,<10",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.14,<1",
  "types-requests>=2.32,<3",
]

[project.scripts]
flowpilot-api = "flowpilot.api.main:run"
flowpilot-worker = "flowpilot.worker.main:run"
flowpilot-seed = "flowpilot.scripts.seed_demo:main"
flowpilot-smoke = "flowpilot.scripts.smoke:main"
flowpilot-odoo-mcp = "flowpilot.odoo_mcp.server:run"
flowpilot-supplier-mcp = "flowpilot.supplier_mcp.server:run"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flowpilot"]

[tool.uv]
default-groups = ["dev"]
required-version = ">=0.10.0"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["odoo_addons", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
"migrations/**/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["odoo_addons", "migrations"]

[[tool.mypy.overrides]]
module = ["agents.*", "mcp.*", "pgvector.*", "prometheus_client.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires a database or service",
  "live: requires external credentials",
]

[tool.coverage.run]
branch = true
source = ["flowpilot"]

[tool.coverage.report]
show_missing = true
fail_under = 70
