apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: flowpilot
spec:
  replicas: 2
  selector:
    matchLabels: {app: flowpilot-api}
  template:
    metadata:
      labels: {app: flowpilot-api}
    spec:
      serviceAccountName: flowpilot
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: api
          image: ghcr.io/ehzawad/fde-api:latest
          imagePullPolicy: IfNotPresent
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: flowpilot-config}
            - secretRef: {name: flowpilot-secrets}
          readinessProbe: {httpGet: {path: /ready, port: http}, initialDelaySeconds: 5, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 15, periodSeconds: 20}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: flowpilot
spec:
  replicas: 2
  selector:
    matchLabels: {app: flowpilot-worker}
  template:
    metadata:
      labels: {app: flowpilot-worker}
    spec:
      serviceAccountName: flowpilot
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: worker
          image: ghcr.io/ehzawad/fde-worker:latest
          envFrom:
            - configMapRef: {name: flowpilot-config}
            - secretRef: {name: flowpilot-secrets}
          resources:
            requests: {cpu: 250m, memory: 384Mi}
            limits: {cpu: "1", memory: 1Gi}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: ["ALL"]}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: flowpilot
spec:
  replicas: 2
  selector:
    matchLabels: {app: flowpilot-web}
  template:
    metadata:
      labels: {app: flowpilot-web}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: web
          image: ghcr.io/ehzawad/fde-web:latest
          ports: [{name: http, containerPort: 3000}]
          envFrom:
            - configMapRef: {name: flowpilot-config}
            - secretRef: {name: flowpilot-secrets}
          readinessProbe: {httpGet: {path: /, port: http}, initialDelaySeconds: 8, periodSeconds: 10}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 512Mi}
          securityContext: {allowPrivilegeEscalation: false, capabilities: {drop: ["ALL"]}}
---
