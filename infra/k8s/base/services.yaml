apiVersion: v1
kind: Service
metadata: {name: api, namespace: flowpilot}
spec:
  selector: {app: flowpilot-api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: flowpilot}
spec:
  selector: {app: flowpilot-web}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: v1
kind: Service
metadata: {name: odoo-mcp, namespace: flowpilot}
spec:
  selector: {app: flowpilot-odoo-mcp}
  ports: [{name: http, port: 8010, targetPort: http}]
