apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - configmap.yaml
  - deployments.yaml
  - services.yaml
  - autoscaling.yaml
  - networkpolicy.yaml
secretGenerator:
  - name: flowpilot-secrets
    namespace: flowpilot
    literals:
      - DATABASE_URL=replace-in-secret-manager
      - WORKER_DATABASE_URL=replace-in-secret-manager
      - OPENAI_API_KEY=replace-in-secret-manager
      - ODOO_API_KEY=replace-in-secret-manager
      - ODOO_DATABASE=replace-me
      - ODOO_ACTION_SIGNING_SECRET=replace-me
      - ODOO_BRIDGE_WEBHOOK_SECRET=replace-me
generatorOptions:
  disableNameSuffixHash: true
